<!doctype html>

<html>
    <head>
        <!-- Recommended meta tags -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <!-- PyScript CSS -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
        <!-- CSS for examples -->
        <link rel="stylesheet" href="./assets/css/examples.css" />

        <!-- This script tag bootstraps PyScript -->
        <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

        <!-- for splashscreen -->
        <style>
            #loading { outline: none; border: none; background: transparent }
            .controls { margin: 20px 0; }
            .input-group { margin: 10px 0; }
            label { display: inline-block; width: 150px; }
            input, select { margin-left: 10px; padding: 5px; }
            button { background-color: #f0ab3c; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
            button:hover { background-color: #d89930; }
            #output { margin-top: 20px; padding: 10px; background-color: #f5f5f5; border-radius: 5px; }
        </style>
        <script type="module">
            const loading = document.getElementById('loading');
            addEventListener('py:ready', () => loading.close());
            loading.showModal();
        </script>

        <title>Dolev-Strong Protocol Visualizer</title>
        <link rel="icon" type="image/png" href="./assets/favicon.png" />
    </head>

    <body>
        <py-config>
            packages = ['cryptography']

            [[fetch]]
            files = ['__init__.py', 'dolev_strong.py', 'visualization.py']
            from = 'crypto'
            to_folder = 'crypto'
        </py-config>

        <dialog id="loading">
            <h1>Loading...</h1>
        </dialog>

        <nav class="navbar" style="background-color: #000000">
            <div class="app-header">
                <a href="/">
                    <img src="./assets/logo.png" class="logo" />
                </a>
                <a class="title" href="" style="color: #f0ab3c">Dolev-Strong Protocol Visualizer</a>
            </div>
        </nav>

        <section class="pyscript">
            <h2>Dolev-Strong Byzantine Agreement Protocol</h2>
            <p>Configure and run a simulation of the Dolev-Strong protocol:</p>
            
            <div class="controls">
                <div class="input-group">
                    <label for="node-count">Number of Nodes:</label>
                    <input type="number" id="node-count" value="5" min="3" max="10">
                </div>
                
                <div class="input-group">
                    <label for="input-message">Input Message:</label>
                    <input type="text" id="input-message" value="Hello World!" maxlength="50">
                </div>
                
                <div class="input-group">
                    <label for="malicious-strategy">Malicious Strategy:</label>
                    <select id="malicious-strategy">
                        <option value="NONE">No Malicious Nodes</option>
                        <option value="SENDER_ONLY">Malicious Sender Only</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="malicious-count">Malicious Count:</label>
                    <input type="number" id="malicious-count" value="1" min="0" max="3">
                </div>
                
                <button id="run-simulation" py-click="run_simulation">Run Simulation</button>
                <button id="run-visualization" py-click="run_visualization">Run with Visualization</button>
            </div>

            <div id="output"></div>

            <script type="py">
                from crypto.dolev_strong import DolevStrong, MaliciousStrategy
                from crypto.visualization import VisualizableDolevStrong
                from pyscript import document
                from datetime import datetime
                import logging

                # Set up logging for web display
                class WebHandler(logging.Handler):
                    def emit(self, record):
                        log_entry = self.format(record)
                        output_element = document.querySelector("#output")
                        output_element.innerHTML += f"<p>{log_entry}</p>"

                # Configure logging
                logging.basicConfig(level=logging.INFO)
                web_handler = WebHandler()
                web_handler.setFormatter(logging.Formatter('%(name)s - %(levelname)s - %(message)s'))
                logging.getLogger().addHandler(web_handler)

                def get_form_values():
                    """Extract values from the form inputs."""
                    node_count = int(document.querySelector("#node-count").value)
                    input_message = document.querySelector("#input-message").value
                    strategy_str = document.querySelector("#malicious-strategy").value
                    malicious_count = int(document.querySelector("#malicious-count").value)
                    
                    # Convert strategy string to enum
                    if strategy_str == "NONE":
                        strategy = MaliciousStrategy.NONE
                        malicious_count = 0
                    elif strategy_str == "SENDER_ONLY":
                        strategy = MaliciousStrategy.SENDER_ONLY
                    else:
                        strategy = MaliciousStrategy.NONE
                        malicious_count = 0
                    
                    return node_count, input_message, strategy, malicious_count

                def display_output(content, append=False):
                    """Helper function to display content in the output div."""
                    output_element = document.querySelector("#output")
                    if append:
                        output_element.innerHTML += content
                    else:
                        output_element.innerHTML = content

                def run_simulation(event):
                    """Run a basic simulation without visualization."""
                    # Clear previous output
                    display_output("<h3>Simulation Results:</h3>")
                    
                    try:
                        node_count, input_message, strategy, malicious_count = get_form_values()
                        
                        # Create and run simulation
                        if strategy == MaliciousStrategy.NONE:
                            ds = DolevStrong(node_count, input_message)
                        else:
                            ds = DolevStrong(node_count, input_message, 
                                           malicious_strategy=strategy, 
                                           malicious_count=malicious_count)
                        
                        display_output(f"<p><strong>Starting simulation with {node_count} nodes, message: '{input_message}'</strong></p>", append=True)
                        
                        ds.run()
                        
                        # Display results
                        display_output("<h4>Final Node Outputs:</h4>", append=True)
                        for i, node in enumerate(ds.all_nodes):
                            node_type = "Sender" if node == ds.sender else "Node"
                            status = "Malicious" if node.is_malicious else "Honest"
                            output_val = node.output()
                            display_output(f"<p>{node_type} {i} ({status}): {output_val}</p>", append=True)
                        
                    except Exception as e:
                        display_output(f"<p style='color: red;'>Error: {str(e)}</p>", append=True)

                def run_visualization(event):
                    """Run simulation with visualization (note: interactive features limited in browser)."""
                    # Clear previous output
                    display_output("<h3>Visualization Results:</h3>")
                    
                    try:
                        node_count, input_message, strategy, malicious_count = get_form_values()
                        
                        display_output(f"<p><strong>Creating visualization with {node_count} nodes, message: '{input_message}'</strong></p>", append=True)
                        display_output("<p><em>Note: Full interactive visualization features are limited in the browser. Use the basic simulation for full results.</em></p>", append=True)
                        
                        # Create visualizable simulation
                        if strategy == MaliciousStrategy.NONE:
                            vds = VisualizableDolevStrong(node_count, input_message)
                        else:
                            vds = VisualizableDolevStrong(node_count, input_message,
                                                        malicious_strategy=strategy,
                                                        malicious_count=malicious_count)
                        
                        # Run the simulation part
                        vds.run_simulation()
                        
                        # Display results
                        display_output("<h4>Final Node Outputs:</h4>", append=True)
                        for i, node in enumerate(vds.ds.all_nodes):
                            node_type = "Sender" if node == vds.ds.sender else "Node"
                            status = "Malicious" if node.is_malicious else "Honest"
                            output_val = node.output()
                            display_output(f"<p>{node_type} {i} ({status}): {output_val}</p>", append=True)
                        
                        # Show message log summary
                        display_output("<h4>Message Flow Summary:</h4>", append=True)
                        for round_num in range(vds.ds.n_rounds + 1):
                            round_messages = [msg for msg in vds.visualizer.message_log if msg["round"] == round_num]
                            display_output(f"<p>Round {round_num}: {len(round_messages)} messages sent</p>", append=True)
                        
                    except Exception as e:
                        display_output(f"<p style='color: red;'>Error: {str(e)}</p>", append=True)

                # Display initial info
                now = datetime.now()
                display_output(f"<p>Application loaded at: {now.strftime('%m/%d/%Y, %H:%M:%S')}</p>")
                display_output("<p>Configure the parameters above and click 'Run Simulation' to start.</p>", append=True)
            </script>
        </section>
    </body>
</html>
